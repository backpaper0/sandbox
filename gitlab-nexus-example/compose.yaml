services:
  gitlab:
    image: gitlab/gitlab-ce:latest
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://localhost:9999'
        gitlab_rails['initial_root_password'] = File.read('/run/secrets/password').gsub("\n", "")
    ports:
      - "9999:9999"
    volumes:
      - gitlab-config:/etc/gitlab
      - gitlab-data:/var/opt/gitlab
      - gitlab-logs:/var/log/gitlab
    secrets:
      - password

  nexus:
    image: sonatype/nexus3:latest
    ports:
      - "8081:8081"
      - "5000:5000"
      - "5001:5001"
    volumes:
      - nexus-data:/nexus-data
    healthcheck:
      test: ["CMD", "curl", "http://localhost:8081/service/rest/v1/status/writable"]

  nexus-init:
    image: python:3.14
    command: python /nexus-init.py
    depends_on:
      nexus:
        condition: service_healthy
    volumes:
      - nexus-data:/nexus-data:ro
    configs:
      - source: nexus-init
        target: /nexus-init.py
    environment:
      NEXUS_URL: http://nexus:8081
    secrets:
      - password

volumes:
  gitlab-config: {}
  gitlab-logs: {}
  gitlab-data: {}
  nexus-data: {}

secrets:
  password:
    file: ./assets/password.txt

configs:
  nexus-init:
    file: ./assets/nexus-init.py